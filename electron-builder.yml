appId: com.example.windowpet
productName: Window Pet
directories:
  output: release
files:
  - dist/**/*
  - package.json
extraResources:
  - from: assets
    to: assets
win:
  target:
    - nsis
    - portable
  icon: build-resources/icon.ico
mac:
  target:
    - dmg
    - zip
  icon: build-resources/icon.icns
  category: public.app-category.entertainment
linux:
  target:
    - AppImage
    - deb
  icon: build-resources/icon.png
  category: Utility
